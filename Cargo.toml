[package]
name = "ee2e-chat"
version = "0.1.0"
edition = "2024"

# The command is `e2ee`. The package keeps its old name so the library crate
# stays `ee2e_chat` and every `use` in the tests goes on working.
[[bin]]
name = "e2ee"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
# The crossterm backend is pure Rust. The default ncurses one links a system C
# library and depends on the locale being set correctly for wide characters,
# which is exactly where the box-drawing glyphs in this UI would break.
cursive = { version = "0.20", default-features = false, features = ["crossterm-backend"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chacha20poly1305 = "0.10"
sha2 = "0.10"
hmac = "0.12"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand = "0.8"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"